# shared-tooling's own tasks, on the shared include it ships (as every repo uses it,
# from ./shared/repo/Taskfile.yml). `task check` runs what CI runs.
version: '3'

includes:
  shared: ./repo/Taskfile.yml

tasks:
  default:
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install the front-end packages' own dependencies, for their checks
    cmds:
      - cd lint/web && npm ci
      - cd test/a11y && npm ci

  lint:
    desc: Scripts, what docs.yml checks (Markdown, repo files and CLAUDE.md, workflow refs, the CHANGELOG's links), the Go sync tool, the Python config and the workflows
    cmds:
      - task: shared:lint:scripts
      # As ci.yml's docs job, which calls docs.yml with shared-path `.`: this repo is its
      # own shared folder, so the workflow refs are checked with -Shared .
      - task: shared:docs:check
      - task: lint:go
      - task: lint:python
      - task: lint:workflows

  lint:python:
    desc: The shared ruff config loads, linting and formatting test/python's script, which mypy --strict checks too, at the versions CI runs
    cmds:
      - uvx ruff@0.17.5 check --config lint/python/ruff.toml --no-cache test/python
      - uvx ruff@0.17.5 format --check --config lint/python/ruff.toml --no-cache test/python
      - uvx mypy@2.4.0 --strict test/python

  lint:go:
    desc: The golangci sync tool, linted by the template it ships, and its advisories
    dir: lint/go
    cmds:
      - go run . -dir . -check
      - go vet ./...
      - golangci-lint run ./...
      # The version go.yml defaults to, as CI runs it.
      - go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  scaler:
    desc: The runners' scaler, as ci.yml's scaler job checks it - its golangci config is current, vet, golangci-lint, govulncheck and its tests
    dir: runner/scaler
    cmds:
      - go run -C ../../lint/go . -dir ../../runner/scaler -check
      # Both builds: the Linux one in its container, the Windows one for Windows jobs.
      - GOOS=linux go vet ./...
      - GOOS=windows go vet ./...
      - golangci-lint run ./...
      - go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - go test -shuffle=on ./...

  lint:workflows:
    desc: actionlint over every workflow, at the version CI runs
    cmds:
      - go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  presets:
    desc: Every lint/web config and test preset loads from its own install
    cmds:
      - node scripts/test-presets.mjs

  test:scripts:
    desc: The scripts' own tests - repo/Invoke-NpmAudit.ps1 on recorded npm audit reports, repo/npm-take-updates.mjs on made-up lockfiles, ci/Invoke-CiShare.ps1's share of the CPUs, and runner/CiRunner.psm1's limits
    cmds:
      - pwsh -NoProfile -File scripts/Test-NpmAudit.ps1
      - node scripts/test-npm-take-updates.mjs
      - pwsh -NoProfile -File scripts/Test-CiShare.ps1
      - pwsh -NoProfile -File scripts/Test-CiRunner.ps1

  release:
    desc: Make a release (-- 1.1.0) - the version everywhere, the CHANGELOG entry and its links, a commit and a tag
    cmds:
      - pwsh -NoProfile -File scripts/New-Release.ps1 {{.CLI_ARGS}}

  push:
    desc: Take the in-range updates Dependabot would open, dismiss the Dependabot alerts osv-scanner.toml passes over, start the self-hosted runners if the repo uses them, git push, and follow CI to its verdict (-- -Yes, -SkipUpdates, -NoWait)
    interactive: true
    cmds:
      - task: shared:push

  check:
    desc: Everything CI runs
    cmds:
      - task: lint
      - task: scaler
      - task: presets
      - task: test:scripts
      - task: shared:vuln

  # This machine's self-hosted runners (runner/README.md), set up from this repo, which
  # every repo then starts and stops with shared:runner:start and shared:runner:stop.
  runner:install:
    desc: Set up the self-hosted runners on this machine - the WSL distro with Docker, the config and the task that runs them
    cmds:
      - pwsh -NoProfile -Command "Import-Module ./runner/CiRunner.psm1; Install-CiRunner"
