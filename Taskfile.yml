# shared-tooling's own tasks, on the shared include it ships (as every repo uses it,
# from ./shared/repo/Taskfile.yml). `task check` runs what CI runs.
version: '3'

includes:
  shared: ./repo/Taskfile.yml

tasks:
  default:
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install the front-end packages' own dependencies, for their checks
    cmds:
      - cd lint/web && npm ci
      - cd test/a11y && npm ci

  lint:
    desc: Scripts, what docs.yml checks (Markdown, repo files and CLAUDE.md, workflow refs, the CHANGELOG's links), the Go sync tool, the Python config and the workflows
    cmds:
      - task: shared:lint:scripts
      # As ci.yml's docs job, which calls docs.yml with shared-path `.`: this repo is its
      # own shared folder, so the workflow refs are checked with -Shared .
      - task: shared:docs:check
      - task: lint:go
      - task: lint:python
      - task: lint:workflows

  lint:python:
    desc: The shared ruff config loads, linting and formatting test/python's script, which mypy --strict checks too, at the versions CI runs
    cmds:
      - uvx ruff@0.17.5 check --config lint/python/ruff.toml --no-cache test/python
      - uvx ruff@0.17.5 format --check --config lint/python/ruff.toml --no-cache test/python
      - uvx mypy@2.4.0 --strict test/python

  lint:go:
    desc: The golangci sync tool, linted by the template it ships, and its advisories
    dir: lint/go
    cmds:
      - go run . -dir . -check
      - go vet ./...
      - golangci-lint run ./...
      # The version go.yml defaults to, as CI runs it.
      - go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  lint:workflows:
    desc: actionlint over every workflow, at the version CI runs
    cmds:
      - go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  presets:
    desc: Every lint/web config and test preset loads from its own install
    cmds:
      - node scripts/test-presets.mjs

  release:
    desc: Make a release (-- 1.1.0) - the version everywhere, the CHANGELOG entry and its links, a commit and a tag
    cmds:
      - pwsh -NoProfile -File scripts/New-Release.ps1 {{.CLI_ARGS}}

  push:
    desc: Take the in-range updates Dependabot would open, scan for advisories, run task check, then git push (-- -Yes, -SkipUpdates, -SkipCheck)
    interactive: true
    cmds:
      - task: shared:push

  check:
    desc: Everything CI runs
    cmds:
      - task: lint
      - task: presets
      - task: shared:vuln

  # This machine's self-hosted runners (runner/README.md).
  runner:install:
    desc: Set up the self-hosted runners on this machine - the WSL distro with Docker, the config and the sign-in task
    cmds:
      - pwsh -NoProfile -Command "Import-Module ./runner/CiRunner.psm1; Install-CiRunner"

  runner:start:
    desc: Start the self-hosted runners now, through their sign-in task
    cmds:
      - pwsh -NoProfile -Command "Start-ScheduledTask -TaskName 'CI runners'"

  runner:stop:
    desc: Stop the self-hosted runners and deregister them, until runner:start or the next sign-in
    cmds:
      - pwsh -NoProfile -Command "Import-Module ./runner/CiRunner.psm1; Stop-CiRunner"

  runner:status:
    desc: Show the self-hosted runners - the loop, their containers, and each repo's runners on GitHub
    cmds:
      - pwsh -NoProfile -Command "Import-Module ./runner/CiRunner.psm1; Get-CiRunnerStatus | Format-Table Repo, Name, Status, Busy"
