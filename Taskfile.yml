# shared-tooling's own tasks, on the shared include it ships (as every repo uses it,
# from ./shared/repo/Taskfile.yml). `task check` runs what CI runs.
version: '3'

includes:
  shared: ./repo/Taskfile.yml

tasks:
  default:
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install the front-end packages' own dependencies, for their checks
    cmds:
      - cd lint/web && npm ci
      - cd test/a11y && npm ci

  lint:
    desc: Scripts, Markdown, the CHANGELOG's links, the Go sync tool, the workflows and the repo files
    cmds:
      - task: shared:lint:scripts
      - task: shared:lint:md
      - task: shared:changelog:check
      - task: lint:go
      - task: lint:workflows
      - task: shared:repo:check

  lint:go:
    desc: The golangci sync tool, linted by the template it ships, and its advisories
    dir: lint/go
    cmds:
      - go run . -dir . -check
      - go vet ./...
      - golangci-lint run ./...
      # The version go.yml defaults to, as CI runs it.
      - go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  lint:workflows:
    desc: actionlint over every workflow, at the version CI runs
    cmds:
      - go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  presets:
    desc: Every lint/web config and test preset loads from its own install
    cmds:
      - node scripts/test-presets.mjs

  release:
    desc: Make a release (-- 1.1.0) - the version everywhere, the CHANGELOG entry and its links, a commit and a tag
    cmds:
      - pwsh -NoProfile -File scripts/New-Release.ps1 {{.CLI_ARGS}}

  push:
    desc: Take the in-range updates Dependabot would open, scan for advisories, run task check, then git push (-- -Yes, -SkipUpdates, -SkipCheck)
    interactive: true
    cmds:
      - task: shared:push

  check:
    desc: Everything CI runs
    cmds:
      - task: lint
      - task: presets
      - task: shared:vuln
