# The advisories OSV-Scanner (osv.yml) may pass over, copied beside each npm lockfile that
# needs them as osv-scanner.toml (web/osv-scanner.toml, frontend/osv-scanner.toml): the
# scanner reads the file next to the lockfile it scans. Keep only the entries a lockfile
# has. standards/packages.md has the rule: an advisory is passed over only when it reaches
# nothing that ships (lint, test and build tooling) and no fix fits its dependents' ranges,
# each with its reason and a date, three months out, when it is looked at again.

# minimatch 7.0.0 to 11.0.0: denial of service from a crafted glob pattern. It comes with
# ESLint 10, @eslint/config-array, typescript-eslint and eslint-plugin-jsx-a11y-x (lint/web),
# which all require ^10.2, and the fix is 11.0.1. Our own lint config writes every pattern.
[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-02-07
reason = "Dev tooling only (ESLint through lint/web); the fix, minimatch 11.0.1, is outside ESLint's ^10.2 range."

# glob 11 and 13: an aborted search can go on reading the file system. It comes with
# @vue/test-utils (js-beautify) and Workbox's build (vite-plugin-pwa), which require glob 11
# and 13, and the fix is 14.0.2. Neither passes an AbortSignal, and neither ships.
[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2027-02-07
reason = "Test and build tooling only (js-beautify, workbox-build); the fix, glob 14.0.2, is outside their ranges."

# deepmerge 4.3.1: mergeObject() can pollute the merged object's prototype. It comes with
# Workbox's build (@rollup/plugin-node-resolve), merging our own build options; no fixed
# version exists yet.
[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2027-02-07
reason = "Build tooling only (workbox-build through @rollup/plugin-node-resolve), merging our own options; no fixed release yet."
