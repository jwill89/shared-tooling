# The Dependabot shape every repo follows: weekly on Monday, one pull request per ecosystem for minors and patches together, and
# majors one by one (they can need code changes). Copy the blocks a repo needs into its
# .github/dependabot.yml and set each `directory`; this file isn't synced, since every
# repo's folders differ.
#
# Dependabot can't read Actions secrets. A repo on the Font Awesome Pro registry adds
# FONTAWESOME_NPM_TOKEN again as a Dependabot secret (Settings, Secrets and variables,
# Dependabot). shared-tooling is public, so no token is needed for the submodule.
version: 2

registries:
  # The project's .npmrc names this registry for its scopes; Dependabot adds the token.
  # Give it no `scope:`: with one, Dependabot writes its own .npmrc in place of the
  # committed one, which loses install-links=true, so the lockfile records lint/web and
  # test/a11y as links and npm ci fails.
  fontawesome:
    type: npm-registry
    url: https://npm.fontawesome.com
    token: ${{ secrets.FONTAWESOME_NPM_TOKEN }}

updates:
  - package-ecosystem: npm
    directory: /web
    registries:
      - fontawesome
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Held on purpose: TypeScript stays on 6.x until vue-tsc supports TypeScript 7.1.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # vue-tsc 3.3.14 turns a `//` in a static attribute (placeholder="https://") into
      # broken virtual code, which stops it checking the rest of that template
      # (vuejs/language-tools#6322). Each Vue project pins vue-tsc at 3.3.13 and skips
      # only 3.3.14, so the fix comes through; drop this once it has.
      - dependency-name: vue-tsc
        versions: ['3.3.14']
      # The tools shared-tooling's lint/web owns move to a new major once, in
      # shared-tooling, with the plugins and configs that must match, and reach here with
      # `task shared:update`; a project's own plugin for one moves with it. Minors and
      # patches still come here.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-*'
        update-types: ['version-update:semver-major']
      - dependency-name: prettier
        update-types: ['version-update:semver-major']
      - dependency-name: stylelint
        update-types: ['version-update:semver-major']
      - dependency-name: 'stylelint-*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      go:
        patterns: ['*']

  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      composer-minor:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /plugins
    schedule:
      interval: weekly
      day: monday
    groups:
      dotnet:
        patterns: ['*']

  # Python's requirements files, compiled from .in files by uv pip compile. Dependabot's uv
  # ecosystem compiles them again with uv pip compile, taking --universal, --python-version
  # and --generate-hashes from the command uv wrote in each file's header, so a file is
  # compiled without --custom-compile-command. The pip ecosystem would compile them with
  # pip-tools instead, which keeps neither --universal nor --python-version.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-minor:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Held on purpose: a package whose data must match its minor, such as spaCy and the
      # model wheel the project pins by URL for it, moves by hand with that wheel. Dependabot
      # can't see a requirement pinned by URL, so nothing else holds the two together.
      - dependency-name: spacy
        update-types: ['version-update:semver-minor', 'version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # shared-tooling's workflows move together with the shared/ submodule, all to one
      # release, through `task shared:update`. Dependabot names each workflow file apart
      # (jwill89/shared-tooling/.github/workflows/web.yml), so left to it, each would get
      # a pull request of its own and move its ref alone, off the submodule's release.
      - dependency-name: 'jwill89/shared-tooling*'
