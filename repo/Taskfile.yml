# The tasks every repo shares, included from its own Taskfile.yml:
#
#   includes:
#     shared: ./shared/repo/Taskfile.yml
#
# They run in the including repo's folder, named shared:<task> (`task shared:lint:scripts`),
# and its own tasks call them (`- task: shared:lint:scripts`). The project keeps its own
# `deploy`, `lint`, `test`, `check` and the rest; `shared:deploy` is the plain form most
# of them wrap. The names follow what the projects' Taskfiles already use.
#
# A project's `task deploy` deploys everything it has, in order: the backend, then the
# front end, then the plugin (only when its version is new, the script's -IfNewer). A
# project whose parts ship separately adds `deploy:backend`, `deploy:frontend` and
# `deploy:plugin` for one part each, and has no `deploy:both` or `deploy:all`
# (standards/deploy-and-ops.md). One whose parts ship in one archive keeps `deploy` alone.
# Each ships the newest release CI tagged on main, built in its own checkout, and does
# nothing when the host already runs it; `task deploy -- -Force` deploys it again.
#
# A project's `task push` wraps `shared:push`: it takes the in-range updates Dependabot
# would open (`shared:deps`), scans the lockfiles for advisories (`shared:vuln`, also part
# of its `task check`), runs `task check`, then pushes (standards/packages.md, Updates).
version: '3'

vars:
  # This file's folder, so the paths hold wherever the submodule sits.
  SHARED: '{{.TASKFILE_DIR}}/..'

tasks:
  lint:scripts:
    desc: PSScriptAnalyzer, with the shared settings, on every tracked PowerShell file
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/lint/pwsh/Invoke-ScriptLint.ps1"

  lint:md:
    desc: markdownlint on the repo's Markdown, through its .markdownlint-cli2.jsonc
    cmds:
      - npx --yes markdownlint-cli2@0.24.0

  repo:sync:
    desc: Copy the shared .editorconfig and .gitattributes in, keeping the repo's own lines
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/repo/Sync-RepoFiles.ps1" -Path .

  repo:check:
    desc: Fail if .editorconfig or .gitattributes differ from the shared ones
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/repo/Sync-RepoFiles.ps1" -Path . -Check

  golangci:sync:
    desc: Write the Go module's .golangci.yml from the shared template (-- -dir backend for a module in a folder)
    cmds:
      - go run -C "{{.SHARED}}/lint/go" . {{.CLI_ARGS}}

  golangci:check:
    desc: Fail if the Go module's .golangci.yml differs from what the template makes
    cmds:
      - go run -C "{{.SHARED}}/lint/go" . -check {{.CLI_ARGS}}

  update:
    desc: Move to a shared-tooling release (-- v1.1.0) - the submodule, the workflow refs and what's built from them
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/repo/Update-SharedTooling.ps1" {{.CLI_ARGS}}

  version:check:
    desc: Fail if the shared workflow refs don't name the release the submodule holds
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/repo/Test-SharedVersion.ps1"

  deploy:
    desc: Run scripts/deploy.ps1 (pass its flags after --, e.g. -- -SkipBuild)
    cmds:
      - pwsh -NoProfile -File scripts/deploy.ps1 {{.CLI_ARGS}}

  deps:
    desc: List the dependency updates Dependabot would open, in range and majors, leaving out what .github/dependabot.yml holds
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/repo/Invoke-DependencyCheck.ps1" -Path .

  deps:update:
    desc: Take the in-range dependency updates (npm, Go, Composer, NuGet); majors and held versions are left alone
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/repo/Invoke-DependencyCheck.ps1" -Path . -Update

  vuln:
    desc: Scan every lockfile with OSV-Scanner, as CI's osv job does, honouring each osv-scanner.toml
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/repo/Invoke-VulnerabilityScan.ps1" -Path .

  push:
    desc: Take the in-range updates Dependabot would open, scan for advisories, run task check, then git push (-- -Yes, -SkipUpdates, -SkipCheck)
    interactive: true
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/repo/Invoke-Push.ps1" -Path . {{.CLI_ARGS}}
