# The tasks every repo shares, included from its own Taskfile.yml:
#
#   includes:
#     shared: ./shared/repo/Taskfile.yml
#
# They run in the including repo's folder, named shared:<task> (`task shared:lint:scripts`),
# and its own tasks call them (`- task: shared:lint:scripts`). The project keeps its own
# `deploy`, `lint`, `test`, `check` and the rest; `shared:deploy` is the plain form most
# of them wrap. The names follow what the projects' Taskfiles already use.
#
# A project's `task deploy` deploys everything it has, in order: the backend, then the
# front end, then the plugin (only when its version is new, the script's -IfNewer). A
# project whose parts ship separately adds `deploy:backend`, `deploy:frontend` and
# `deploy:plugin` for one part each, and has no `deploy:both` or `deploy:all`
# (standards/deploy-and-ops.md). One whose parts ship in one archive keeps `deploy` alone.
# Each ships the newest release CI tagged on main, built in its own checkout, and does
# nothing when the host already runs it; `task deploy -- -Force` deploys it again.
#
# A project's `task push` wraps `shared:push`: it takes the in-range updates Dependabot
# would open (`shared:deps`), starts this machine's runners when the repo's CI uses them
# (`shared:runner:start`), pushes, and follows the CI run, which does the checking
# (standards/packages.md, Updates).
#
# A project's `task check` calls `shared:docs:check` for everything docs.yml checks, so a
# check docs.yml gains arrives with the release, and adds the checks whose numbers and
# folders are its own: the coverage floors, the specs' type-check, the generated files.
version: '3'

vars:
  # This file's folder, so the paths hold wherever the submodule sits.
  SHARED: '{{.TASKFILE_DIR}}/..'
  # The Python of a project's .venv, which python:setup makes.
  PY: '{{if eq OS "windows"}}.venv/Scripts/python.exe{{else}}.venv/bin/python{{end}}'

tasks:
  lint:scripts:
    desc: PSScriptAnalyzer, with the shared settings, on every tracked PowerShell file
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/lint/pwsh/Invoke-ScriptLint.ps1"

  lint:md:
    desc: markdownlint on the repo's Markdown, through its .markdownlint-cli2.jsonc
    cmds:
      - npx --yes markdownlint-cli2@0.24.0

  repo:sync:
    desc: Copy the shared .editorconfig and .gitattributes in, keeping the repo's own lines
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/repo/Sync-RepoFiles.ps1" -Path .

  repo:check:
    desc: Fail if .editorconfig or .gitattributes differ from the shared ones, or CLAUDE.md isn't in the standard form
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/repo/Sync-RepoFiles.ps1" -Path . -Check

  docs:check:
    desc: Everything docs.yml checks - the Markdown, the repo files and CLAUDE.md, the shared workflow refs, the CHANGELOG links (CHANGELOGS='CHANGELOG.md plugin/CHANGELOG.md')
    cmds:
      - task: lint:md
      - task: repo:check
      - task: version:check
      - pwsh -NoProfile -File "{{.SHARED}}/repo/Update-ChangelogLinks.ps1" -Check -Path "{{.CHANGELOGS | default "CHANGELOG.md"}}"

  golangci:sync:
    desc: Write the Go module's .golangci.yml from the shared template (-- -dir backend for a module in a folder)
    cmds:
      - go run -C "{{.SHARED}}/lint/go" . {{.CLI_ARGS}}

  golangci:check:
    desc: Fail if the Go module's .golangci.yml differs from what the template makes
    cmds:
      - go run -C "{{.SHARED}}/lint/go" . -check {{.CLI_ARGS}}

  changelog:links:
    desc: Write the compare link under each CHANGELOG.md heading (-- -Path plugin/CHANGELOG.md -TagPrefix plugin-v for a second part)
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/repo/Update-ChangelogLinks.ps1" {{.CLI_ARGS}}

  changelog:check:
    desc: Fail if a CHANGELOG.md heading has no compare link, as docs.yml checks (-- -Path 'CHANGELOG.md plugin/CHANGELOG.md')
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/repo/Update-ChangelogLinks.ps1" -Check {{.CLI_ARGS}}

  go:coverage:
    desc: A Go module's tests with coverage, held to the floor go.yml holds (DIR=backend FLOOR=62.5 EXCLUDE=... COVERPKG=./...)
    requires:
      vars: [FLOOR]
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/test/go/Invoke-GoCoverage.ps1" -Path "{{.DIR | default "."}}" -Floor {{.FLOOR}} -Exclude "{{.EXCLUDE}}" -CoverPkg "{{.COVERPKG}}"

  web:specs:
    desc: Type-check a front end's Vitest specs under its tsconfig.vitest.json, as web.yml does (DIR=web; -- --fix writes or fixes the file instead)
    cmds:
      - node "{{.SHARED}}/test/web/typecheck-specs.mjs" "{{.DIR | default "web"}}" {{.CLI_ARGS}}

  python:setup:
    desc: Make .venv with uv on the Python .python-version names, then install the dev requirements, every hash checked (DIR=. REQUIREMENTS=requirements-dev.txt)
    dir: '{{.DIR | default "."}}'
    cmds:
      # uv venv fetches that Python when it isn't installed yet. uv python install isn't used:
      # on Windows it can exit 2 after a good install, over the minor-version link it makes.
      - uv venv --clear --managed-python .venv
      - uv pip install --require-hashes -r "{{.REQUIREMENTS | default "requirements-dev.txt"}}"

  python:lint:
    desc: ruff check, ruff format --check and mypy --strict, as python.yml runs them (DIR=.)
    dir: '{{.DIR | default "."}}'
    cmds:
      - '{{.PY}} -m ruff check .'
      - '{{.PY}} -m ruff format --check .'
      - '{{.PY}} -m mypy --strict'

  python:test:
    desc: pytest with line coverage, failing below the floor pyproject.toml sets or with none set, as python.yml runs it (DIR=.)
    dir: '{{.DIR | default "."}}'
    cmds:
      - '{{.PY}} "{{.SHARED}}/test/python/coverage_floor.py"'
      - '{{.PY}} -m pytest --cov --cov-report=term-missing:skip-covered'

  update:
    desc: Move to a shared-tooling release (-- v1.1.0) - the submodule, the workflow refs and what's built from them
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/repo/Update-SharedTooling.ps1" {{.CLI_ARGS}}

  version:check:
    desc: Fail if the shared workflow refs don't name the release the submodule holds
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/repo/Test-SharedVersion.ps1" -Shared "{{.SHARED}}"

  deploy:
    desc: Run scripts/deploy.ps1 (pass its flags after --, e.g. -- -SkipBuild)
    cmds:
      - pwsh -NoProfile -File scripts/deploy.ps1 {{.CLI_ARGS}}

  deps:
    desc: List the dependency updates Dependabot would open, in range and majors, leaving out what .github/dependabot.yml holds
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/repo/Invoke-DependencyCheck.ps1" -Path .

  deps:update:
    desc: Take the in-range dependency updates (npm, Go, Composer, NuGet, Python's compiled requirements); majors and held versions are left alone
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/repo/Invoke-DependencyCheck.ps1" -Path . -Update

  deps:alerts:
    desc: Hold Dependabot's alerts to the osv-scanner.toml files - dismiss the ones they pass over, with their reasons, and open again the ones whose entry has gone or run out (-- -WhatIf to see first)
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/repo/Sync-DependabotAlerts.ps1" -Path . {{.CLI_ARGS}}

  vuln:
    desc: Scan every lockfile with OSV-Scanner, as CI's osv job does, honouring each osv-scanner.toml
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/repo/Invoke-VulnerabilityScan.ps1" -Path .

  # This machine's self-hosted runners (runner/README.md), which run the CI of every repo
  # whose CI_RUNNER variable names them, and only between a start and a stop.
  runner:start:
    desc: Start this machine's self-hosted runners - the WSL distro, Docker and the scaler - and wait until they take jobs
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/runner/Invoke-CiRunner.ps1" -Action Start

  runner:stop:
    desc: Stop this machine's self-hosted runners and shut their WSL distro down, giving its memory back; jobs queue on GitHub until the next start
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/runner/Invoke-CiRunner.ps1" -Action Stop

  runner:status:
    desc: Show this machine's self-hosted runners - the loop, the scaler and its last lines, the jobs' limits, and the jobs running now
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/runner/Invoke-CiRunner.ps1" -Action Status

  push:
    desc: Take the in-range updates Dependabot would open, dismiss the Dependabot alerts osv-scanner.toml passes over, start the self-hosted runners if the repo uses them, git push, and follow CI to its verdict (-- -Yes, -SkipUpdates, -NoWait)
    interactive: true
    cmds:
      - pwsh -NoProfile -File "{{.SHARED}}/repo/Invoke-Push.ps1" -Path . {{.CLI_ARGS}}
