name: Python

# The Python job every repo with a Python app calls: uv at a pinned version, the exact Python
# the version file names, the dev requirements installed with every hash checked, then ruff,
# ruff format, mypy --strict, and pytest with the coverage floor pyproject.toml sets. The
# tools come from the project's own pinned requirements.
#
#   python:
#     uses: jwill89/shared-tooling/.github/workflows/python.yml@v2.10.0
#     with:
#       before: python -m tools.build_data
#       cache-path: var/data.sqlite
#       cache-key-files: |
#         tools/build_data.py
#         requirements-dev.txt
#       artifact-path: var/data.sqlite
#       artifact-name: data

on:
  workflow_call:
    inputs:
      dir:
        description: The folder holding pyproject.toml.
        type: string
        default: .
      python-version-file:
        description: The file naming the exact Python (3.14.9, say), relative to dir.
        type: string
        default: .python-version
      requirements:
        description: The requirements file to install, every package pinned with its hashes, relative to dir.
        type: string
        default: requirements-dev.txt
      uv-version:
        description: The uv release, checked against its published checksum.
        type: string
        default: 0.13.5
      before:
        description: Shell run from dir after the install and before the checks, with .venv's python first on PATH (a data build, say).
        type: string
        default: ''
      cache-path:
        description: Paths, relative to the repo, restored before `before` and saved after it; goes with cache-key-files.
        type: string
        default: ''
      cache-key-files:
        description: Files whose contents key that cache, one glob per line, relative to the repo.
        type: string
        default: ''
      artifact-path:
        description: A path, relative to the repo, uploaded once every check passes.
        type: string
        default: ''
      artifact-name:
        description: The uploaded artifact's name.
        type: string
        default: python-build

permissions:
  contents: read

jobs:
  python:
    # A pull request from a fork runs on GitHub's runners, never on a self-hosted one.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || vars.CI_RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: ${{ inputs.dir }}
    env:
      # Each check runs through ci/Invoke-CiCheck.ps1, which records it for the run's report.
      CI_TOOLS: ${{ github.workspace }}/shared/ci
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Inputs
        if: (inputs.cache-path != '') != (inputs.cache-key-files != '')
        run: |
          echo "::error::Pass cache-path and cache-key-files together: the files' contents key the cache."
          exit 1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ inputs.uv-version }}
          working-directory: ${{ inputs.dir }}
          cache-dependency-glob: ${{ inputs.requirements }}

      # The exact Python the file names, fetched by uv, then the pinned packages; uv refuses
      # one whose hash doesn't match.
      - name: Install
        env:
          VERSION_FILE: ${{ inputs.python-version-file }}
          REQUIREMENTS: ${{ inputs.requirements }}
        shell: pwsh
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'Install' -Command 'uv venv --managed-python --python "$(tr -d "[:space:]" < "$VERSION_FILE")" .venv && uv pip install --require-hashes -r "$REQUIREMENTS"'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value "$PWD/.venv/bin"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "VIRTUAL_ENV=$PWD/.venv"

      - name: Restore the build cache
        id: build-cache
        if: inputs.cache-path != ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ inputs.cache-path }}
          key: python-before-${{ runner.os }}-${{ hashFiles(inputs.cache-key-files) }}

      - name: Before
        if: inputs.before != ''
        shell: pwsh
        env:
          BEFORE: ${{ inputs.before }}
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'Before' -Command 'bash -euo pipefail -c "$BEFORE"'

      # Saved at once, so a failing check doesn't throw the build away.
      - name: Save the build cache
        if: inputs.cache-path != '' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: ruff check
        shell: pwsh
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'ruff check' -Command 'python -m ruff check --output-format=github .'

      - name: ruff format
        shell: pwsh
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'ruff format' -Command 'python -m ruff format --check .'

      # --strict on the command line, so a project's config chooses what is checked but
      # can't turn strictness off.
      - name: mypy
        shell: pwsh
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'mypy' -Command 'python -m mypy --strict'

      - name: Coverage floor is set
        shell: pwsh
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'Coverage floor is set' -Command 'python "$GITHUB_WORKSPACE/shared/test/python/coverage_floor.py"'

      # pytest-cov fails the run below the floor in pyproject.toml's [tool.coverage.report].
      - name: Tests
        shell: pwsh
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'Tests' -Command 'python -m pytest --cov --cov-report=term-missing:skip-covered'

      - name: Upload ${{ inputs.artifact-name }}
        if: inputs.artifact-path != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error

      # On a failure, the job's checks go up for report.yml to merge into the run's report.
      - name: CI report
        id: ci-report
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: '& "$env:CI_TOOLS/Complete-CiReport.ps1"'

      - name: Upload the CI report
        if: failure() && steps.ci-report.outputs.name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ci-report.outputs.name }}
          path: ${{ runner.temp }}/ci-report
          retention-days: 7
          if-no-files-found: ignore
