name: Go

# The Go job every repo with a Go module calls: the shared golangci config is current,
# vet, golangci-lint, govulncheck, the tests under the race detector in shuffled order
# with a coverage floor, and an optional build.
#
#   go:
#     needs: web   # when the binary embeds the front end's build
#     uses: jwill89/shared-tooling/.github/workflows/go.yml@v1.0.0
#     with:
#       download-artifact: web-dist
#       download-path: web/dist
#       coverage-floor: 62.5
#       coverage-exclude: /internal/db/
#       build: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/myapp-linux-amd64 ./cmd/myapp

on:
  workflow_call:
    inputs:
      dir:
        description: The Go module's folder.
        type: string
        default: .
      golangci-lint-version:
        description: The golangci-lint release, built from source with the module's toolchain.
        type: string
        default: v2.15.0
      # Keep it recent: an old release analyses code with an old golang.org/x/tools, which
      # crashes on newer Go (v1.1.4's x/tools v0.29.0 panics under Go 1.27).
      # shared-tooling's own CI runs this same version on lint/go.
      govulncheck-version:
        description: The govulncheck release.
        type: string
        default: v1.9.0
      race:
        description: Run the tests under the race detector.
        type: boolean
        default: true
      coverage-floor:
        description: The lowest statement coverage allowed, in percent. 0 reports without failing.
        type: number
        default: 0
      coverpkg:
        description: >-
          The packages a test run counts coverage in, as go test's -coverpkg takes them.
          ./... credits code with the tests of every package that runs it, such as a handler
          package exercised through the server's request tests. Empty counts each package's
          own tests only.
        type: string
        default: ''
      coverage-exclude:
        description: Regular expressions, one per line; matching files are left out of the coverage count.
        type: string
        default: ''
      apt-packages:
        description: Ubuntu packages the build needs (Fyne's window libraries, say).
        type: string
        default: ''
      download-artifact:
        description: An artifact to download first (the front end's build, for a binary that embeds it).
        type: string
        default: ''
      download-path:
        description: Where the artifact goes, relative to the repo.
        type: string
        default: web/dist
      build:
        description: A build command to run last, in the module's folder.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  go:
    # A pull request from a fork runs on GitHub's runners, never on a self-hosted one.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || vars.CI_RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: ${{ inputs.dir }}
    env:
      # Each check runs through ci/Invoke-CiCheck.ps1, which records it for the run's report.
      CI_TOOLS: ${{ github.workspace }}/shared/ci
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      # On a self-hosted runner Go's caches live on the runner (runner/README.md), so nothing
      # goes to GitHub's cache from there.
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.dir }}/go.mod
          cache-dependency-path: ${{ inputs.dir }}/go.sum
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Download ${{ inputs.download-artifact }}
        if: inputs.download-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.download-artifact }}
          path: ${{ inputs.download-path }}

      - name: Ubuntu packages
        if: inputs.apt-packages != ''
        env:
          PACKAGES: ${{ inputs.apt-packages }}
        shell: pwsh
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'Ubuntu packages' -Command 'sudo apt-get update && sudo apt-get install -y --no-install-recommends $PACKAGES'

      - name: golangci config is current
        working-directory: shared/lint/go
        shell: pwsh
        env:
          MODULE_DIR: ${{ inputs.dir }}
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'golangci config is current' -Command 'go run . -dir "$MODULE_DIR" -check'

      - name: go vet
        shell: pwsh
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'go vet' -Command 'go vet ./...'

      # Built from source with the module's toolchain: a prebuilt linter binary cannot
      # read export data from a newer Go than it was compiled with. Go's build cache keeps
      # the build between runs.
      - name: golangci-lint
        shell: pwsh
        env:
          VERSION: ${{ inputs.golangci-lint-version }}
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'golangci-lint' -Command 'go run "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$VERSION" run'

      - name: govulncheck
        shell: pwsh
        env:
          VERSION: ${{ inputs.govulncheck-version }}
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'govulncheck' -Command 'go run "golang.org/x/vuln/cmd/govulncheck@$VERSION" ./...'

      - name: Tests
        shell: pwsh
        env:
          RACE: ${{ inputs.race && '-race' || '' }}
          COVERPKG: ${{ inputs.coverpkg }}
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'Tests' -Command 'go test $RACE -shuffle=on -covermode=atomic ${COVERPKG:+"-coverpkg=$COVERPKG"} -coverprofile=coverage.out ./...'

      - name: Coverage floor
        shell: pwsh
        env:
          FLOOR: ${{ inputs.coverage-floor }}
          EXCLUDE: ${{ inputs.coverage-exclude }}
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'Coverage floor' -Command 'pwsh -NoProfile -Command ''& "$env:GITHUB_WORKSPACE/shared/test/go/Test-CoverageFloor.ps1" -ProfilePath coverage.out -Floor ([double] $env:FLOOR) -Exclude @($env:EXCLUDE -split "`n" | ForEach-Object Trim | Where-Object { $_ })'''

      - name: Build
        if: inputs.build != ''
        shell: pwsh
        env:
          BUILD: ${{ inputs.build }}
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'Build' -Command 'bash -c "$BUILD"'

      # On a failure, the job's checks go up for report.yml to merge into the run's report.
      - name: CI report
        id: ci-report
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: '& "$env:CI_TOOLS/Complete-CiReport.ps1"'

      - name: Upload the CI report
        if: failure() && steps.ci-report.outputs.name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ci-report.outputs.name }}
          path: ${{ runner.temp }}/ci-report
          retention-days: 7
          if-no-files-found: ignore
