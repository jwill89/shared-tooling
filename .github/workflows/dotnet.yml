name: .NET

# The C# job for the Dalamud plugins: Dalamud's published build files, a Release build,
# `dotnet format` with nothing to change, and the tests where there are any.
#
#   plugin:
#     uses: jwill89/shared-tooling/.github/workflows/dotnet.yml@v1.0.0
#     with:
#       projects: plugins/Example plugins/Example.Preview
#       test-project: plugins/Example.Tests

on:
  workflow_call:
    inputs:
      projects:
        description: Projects (folders or .csproj files) to build and format-check, separated by spaces.
        type: string
        required: true
      test-project:
        description: A test project to run, if the plugin has one.
        type: string
        default: ''
      dotnet-version:
        description: The .NET SDK.
        type: string
        default: 10.0.x
      dalamud:
        description: Fetch the Dalamud files a plugin compiles against, which only XIVLauncher installs.
        type: boolean
        default: true
      warnings-as-errors:
        description: Fail the build on any warning, the analyzers' and the code style's included.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dotnet:
    # A pull request from a fork runs on GitHub's runners, never on a self-hosted one.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || vars.CI_RUNNER || 'ubuntu-24.04' }}
    env:
      # Each check runs through ci/Invoke-CiCheck.ps1, which records it for the run's report.
      CI_TOOLS: ${{ github.workspace }}/shared/ci
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      # Tracking `latest` means an upstream Dalamud API bump can turn this red, which is
      # the cue to raise the plugin's DalamudApiLevel.
      - name: Dalamud
        if: inputs.dalamud
        shell: pwsh
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'Dalamud' -Command 'curl -fsSL -o "$RUNNER_TEMP/dalamud.zip" https://goatcorp.github.io/dalamud-distrib/latest.zip && unzip -q "$RUNNER_TEMP/dalamud.zip" -d "$RUNNER_TEMP/dalamud"'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "DALAMUD_HOME=$env:RUNNER_TEMP/dalamud"

      - name: Build
        env:
          PROJECTS: ${{ inputs.projects }}
          STRICT: ${{ inputs.warnings-as-errors && '-p:TreatWarningsAsErrors=true' || '' }}
        shell: pwsh
        run: |
          foreach ($project in -split $env:PROJECTS) {
            & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name "dotnet build $project" -Command "dotnet build `"$project`" -c Release `$STRICT" -Group
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Style
        env:
          PROJECTS: ${{ inputs.projects }}
        shell: pwsh
        run: |
          foreach ($project in -split $env:PROJECTS) {
            & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name "dotnet format $project" -Command "dotnet format `"$project`" --verify-no-changes" -Group
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Tests
        if: inputs.test-project != ''
        env:
          TEST_PROJECT: ${{ inputs.test-project }}
          # From the test project's own folder, so a global.json beside it is read: one
          # that picks Microsoft.Testing.Platform makes `dotnet test` take --project;
          # without one, the older runner takes a plain path.
          TESTS: |
            cd "$(dirname "$TEST_PROJECT")"
            name=$(basename "$TEST_PROJECT")
            dir=$PWD
            mtp=
            while :; do
              if grep -qs '"Microsoft.Testing.Platform"' "$dir/global.json"; then mtp=1; break; fi
              if [ -f "$dir/global.json" ] || [ "$dir" = / ] || [ "$dir" = "$GITHUB_WORKSPACE" ]; then break; fi
              dir=$(dirname "$dir")
            done
            if [ -n "$mtp" ]; then
              dotnet test --project "$name"
            else
              dotnet test "$name"
            fi
        shell: pwsh
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'dotnet format (tests)' -Command 'dotnet format "$TEST_PROJECT" --verify-no-changes'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'dotnet test' -Command 'bash -c "$TESTS"'

      # On a failure, the job's checks go up for report.yml to merge into the run's report.
      - name: CI report
        id: ci-report
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: '& "$env:CI_TOOLS/Complete-CiReport.ps1"'

      - name: Upload the CI report
        if: failure() && steps.ci-report.outputs.name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ci-report.outputs.name }}
          path: ${{ runner.temp }}/ci-report
          retention-days: 7
          if-no-files-found: ignore
