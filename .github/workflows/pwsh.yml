name: PowerShell

# Every tracked PowerShell file, with PSScriptAnalyzer as shared/lint/pwsh sets it,
# pinned so local runs and CI agree. It runs shared/lint/pwsh/Invoke-ScriptLint.ps1,
# the same script `task shared:lint:scripts` runs locally. It lints every tracked
# script rather than a list, so a new script is never left out.
#
#   scripts:
#     uses: jwill89/shared-tooling/.github/workflows/pwsh.yml@v1.0.0

on:
  workflow_call:
    inputs:
      analyzer-version:
        description: The PSScriptAnalyzer release.
        type: string
        default: 1.25.0
      shared-path:
        description: Where shared-tooling is checked out, relative to the repo.
        type: string
        default: shared

permissions:
  contents: read

jobs:
  pwsh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: PSScriptAnalyzer
        shell: pwsh
        env:
          ANALYZER_VERSION: ${{ inputs.analyzer-version }}
          SHARED: ${{ inputs.shared-path }}
        run: |
          Install-PSResource PSScriptAnalyzer -Version $env:ANALYZER_VERSION -Scope CurrentUser -TrustRepository -Quiet
          Import-Module PSScriptAnalyzer -RequiredVersion $env:ANALYZER_VERSION
          & (Join-Path $env:SHARED 'lint/pwsh/Invoke-ScriptLint.ps1')
