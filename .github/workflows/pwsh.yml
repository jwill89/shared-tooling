name: PowerShell

# Every tracked PowerShell file, with PSScriptAnalyzer as shared/lint/pwsh sets it,
# pinned so local runs and CI agree. It runs shared/lint/pwsh/Invoke-ScriptLint.ps1,
# the same script `task shared:lint:scripts` runs locally. It lints every tracked
# script rather than a list, so a new script is never left out.
#
#   scripts:
#     uses: jwill89/shared-tooling/.github/workflows/pwsh.yml@v1.0.0

on:
  workflow_call:
    inputs:
      analyzer-version:
        description: The PSScriptAnalyzer release.
        type: string
        default: 1.25.0
      shared-path:
        description: Where shared-tooling is checked out, relative to the repo.
        type: string
        default: shared

permissions:
  contents: read

jobs:
  pwsh:
    # A pull request from a fork runs on GitHub's runners, never on a self-hosted one.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || vars.CI_RUNNER || 'ubuntu-24.04' }}
    env:
      # Each check runs through ci/Invoke-CiCheck.ps1, which records it for the run's report.
      CI_TOOLS: ${{ github.workspace }}/${{ inputs.shared-path }}/ci
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Install PSScriptAnalyzer
        shell: pwsh
        env:
          ANALYZER_VERSION: ${{ inputs.analyzer-version }}
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'Install PSScriptAnalyzer' -Command 'pwsh -NoProfile -Command "Install-PSResource PSScriptAnalyzer -Version $ANALYZER_VERSION -Scope CurrentUser -TrustRepository -Quiet"'

      - name: PSScriptAnalyzer
        shell: pwsh
        env:
          ANALYZER_VERSION: ${{ inputs.analyzer-version }}
          SHARED: ${{ inputs.shared-path }}
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'PSScriptAnalyzer' -Command 'pwsh -NoProfile -File "$SHARED/lint/pwsh/Invoke-ScriptLint.ps1" -AnalyzerVersion "$ANALYZER_VERSION"'

      # On a failure, the job's checks go up for report.yml to merge into the run's report.
      - name: CI report
        id: ci-report
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: '& "$env:CI_TOOLS/Complete-CiReport.ps1"'

      - name: Upload the CI report
        if: failure() && steps.ci-report.outputs.name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ci-report.outputs.name }}
          path: ${{ runner.temp }}/ci-report
          retention-days: 7
          if-no-files-found: ignore
