name: Web

# The front-end job every repo with a Vue or React app calls: install (with the Font
# Awesome Pro registry when the app uses it), audit, then the npm scripts the caller
# lists, in order.
#
#   web:
#     uses: jwill89/shared-tooling/.github/workflows/web.yml@v1.0.0
#     with:
#       dir: web
#       scripts: lint typecheck format:check test build
#       fontawesome: true
#       artifact-path: web/dist
#     secrets:
#       FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_NPM_TOKEN }}

on:
  workflow_call:
    inputs:
      dir:
        description: The front end's folder.
        type: string
        default: web
      node-version-file:
        description: The Node version file. Defaults to <dir>/.nvmrc.
        type: string
        default: ''
      scripts:
        description: npm scripts to run, in order, separated by spaces or newlines.
        type: string
        default: lint typecheck format:check test build
      fontawesome:
        description: Install from the Font Awesome Pro registry (needs the FONTAWESOME_TOKEN secret, which callers pass from their FONTAWESOME_NPM_TOKEN).
        type: boolean
        default: false
      audit:
        description: Fail on a high advisory in the packages that ship to the browser.
        type: boolean
        default: true
      artifact-path:
        description: A folder to upload once the scripts pass (a build that a Go binary embeds, say).
        type: string
        default: ''
      artifact-name:
        description: The uploaded artifact's name.
        type: string
        default: web-dist
    secrets:
      FONTAWESOME_TOKEN:
        description: The Font Awesome package token.
        required: false

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.dir }}
    steps:
      # The shared-tooling submodule is public, so the default token fetches it. No
      # credential is left in .git/config for an install script to read.
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.node-version-file || format('{0}/.nvmrc', inputs.dir) }}

      # Every Font Awesome download counts against the account's monthly bandwidth, so a
      # package is fetched from the registry once, not once per run. node_modules comes
      # back whole while nothing it was built from has changed; the shared packages are
      # copied in at install (install-links), so their files are part of its key.
      - name: Restore dependencies
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: ${{ inputs.dir }}/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', inputs.dir), format('{0}/.nvmrc', inputs.dir), 'shared/lint/web/*.js', 'shared/lint/web/*.json', 'shared/test/a11y/*.js', 'shared/test/a11y/*.json') }}

      # When something has changed (a bumped package, a shared-tooling release, a
      # Dependabot branch), npm's download cache comes back from the newest earlier run,
      # this branch's or the default branch's, and `npm ci --prefer-offline` takes every
      # package it already holds from there. Only what changed is fetched, so a Font
      # Awesome package is downloaded again only when its own version changes.
      - name: Restore the npm cache
        id: npm-cache
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', inputs.dir)) }}
          restore-keys: npm-${{ runner.os }}-

      - name: Font Awesome registry
        if: inputs.fontawesome && steps.deps.outputs.cache-hit != 'true'
        env:
          FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_TOKEN }}
        run: |
          test -n "$FONTAWESOME_TOKEN" || { echo "::error::No Font Awesome token: pass the repo's FONTAWESOME_NPM_TOKEN secret as FONTAWESOME_TOKEN."; exit 1; }
          {
            echo "@awesome.me:registry=https://npm.fontawesome.com/"
            echo "@fortawesome:registry=https://npm.fontawesome.com/"
            echo "//npm.fontawesome.com/:_authToken=${FONTAWESOME_TOKEN}"
          } >> ~/.npmrc

      - name: Install
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      # Saved as soon as the install is done, not when the job ends, so a step that fails
      # later doesn't throw the download away and send the next run back to the registry.
      - name: Save dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ inputs.dir }}/node_modules
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Save the npm cache
        if: steps.deps.outputs.cache-hit != 'true' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      # Nothing after the install needs the registry, so the token goes before any of
      # the project's own code runs.
      - name: Remove the registry token
        if: inputs.fontawesome
        run: rm -f ~/.npmrc

      - name: Advisories (packages that ship)
        if: inputs.audit
        run: npm audit --audit-level=high --omit=dev

      - name: Scripts
        env:
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          for script in $SCRIPTS; do
            echo "::group::npm run $script"
            npm run "$script"
            echo "::endgroup::"
          done

      - name: Upload ${{ inputs.artifact-name }}
        if: inputs.artifact-path != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          retention-days: 1
