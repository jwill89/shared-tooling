name: CI

# shared-tooling's own checks, the same `task check` runs: its scripts with its own
# analyzer settings, its docs with its own Markdown config and the CHANGELOG's links, the
# golangci sync tool linted by the template it ships, every workflow with actionlint,
# every lint/web config and test preset loading from its own install, and OSV-Scanner
# over the lockfiles.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    uses: ./.github/workflows/pwsh.yml
    with:
      shared-path: .

  docs:
    uses: ./.github/workflows/docs.yml
    with:
      shared-path: .

  go:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lint/go
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: lint/go/go.mod
          cache-dependency-path: lint/go/go.sum
      - run: go run . -dir . -check
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: goinstall
          working-directory: lint/go
      # The version go.yml defaults to, so a release that can't analyse current Go fails
      # here before it reaches a project.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            lint/web/package-lock.json
            test/a11y/package-lock.json
      - run: npm ci
        working-directory: lint/web
      - run: npm ci
        working-directory: test/a11y
      # Every config and preset loads, from its own package's install.
      - run: node scripts/test-presets.mjs

  osv:
    uses: ./.github/workflows/osv.yml
    permissions:
      contents: read
      actions: read
      security-events: write
