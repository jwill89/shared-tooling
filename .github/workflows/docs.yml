name: Docs and repo files

# Every repo calls this:
#   - its Markdown, with the shared markdownlint config (through the repo's
#     .markdownlint-cli2.jsonc);
#   - its .editorconfig and .gitattributes, still matching shared-tooling/repo above
#     their project marker, and its CLAUDE.md in the standard form, with AGENTS.md beside it;
#   - its shared workflow refs, naming the release its submodule holds;
#   - its changelogs: every version heading, and Unreleased, has its compare link.
# Go-only repos need no Node locally for the Markdown: the VS Code extension lints in
# the editor, and this runs it here.
#
#   docs:
#     uses: jwill89/shared-tooling/.github/workflows/docs.yml@v1.0.0

on:
  workflow_call:
    inputs:
      markdownlint-cli2-version:
        description: The markdownlint-cli2 release.
        type: string
        default: 0.24.0
      repo-files:
        description: Check .editorconfig and .gitattributes against shared-tooling/repo, and CLAUDE.md's form.
        type: boolean
        default: true
      shared-path:
        description: Where shared-tooling is checked out, relative to the repo.
        type: string
        default: shared
      changelogs:
        description: The changelogs whose compare links are checked, separated by spaces; a repo with two parts versioned apart lists both.
        type: string
        default: CHANGELOG.md

permissions:
  contents: read

jobs:
  docs:
    # A pull request from a fork runs on GitHub's runners, never on a self-hosted one.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || vars.CI_RUNNER || 'ubuntu-24.04' }}
    env:
      # Each check runs through ci/Invoke-CiCheck.ps1, which records it for the run's report.
      CI_TOOLS: ${{ github.workspace }}/${{ inputs.shared-path }}/ci
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Markdown
        shell: pwsh
        env:
          VERSION: ${{ inputs.markdownlint-cli2-version }}
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'Markdown' -Command 'npx --yes "markdownlint-cli2@$VERSION"'

      - name: Repo files are current
        if: inputs.repo-files
        shell: pwsh
        env:
          SHARED: ${{ inputs.shared-path }}
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'Repo files are current' -Command 'pwsh -NoProfile -File "$SHARED/repo/Sync-RepoFiles.ps1" -Path . -Check'

      - name: Shared workflow refs match the submodule
        shell: pwsh
        env:
          SHARED: ${{ inputs.shared-path }}
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'Shared workflow refs match the submodule' -Command 'pwsh -NoProfile -File "$SHARED/repo/Test-SharedVersion.ps1" -Shared "$SHARED"'

      - name: CHANGELOG compare links
        shell: pwsh
        env:
          SHARED: ${{ inputs.shared-path }}
          CHANGELOGS: ${{ inputs.changelogs }}
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'CHANGELOG compare links' -Command 'pwsh -NoProfile -File "$SHARED/repo/Update-ChangelogLinks.ps1" -Path "$CHANGELOGS" -Check'

      # On a failure, the job's checks go up for report.yml to merge into the run's report.
      - name: CI report
        id: ci-report
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: '& "$env:CI_TOOLS/Complete-CiReport.ps1"'

      - name: Upload the CI report
        if: failure() && steps.ci-report.outputs.name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ci-report.outputs.name }}
          path: ${{ runner.temp }}/ci-report
          retention-days: 7
          if-no-files-found: ignore
