name: PHP

# The PHP job: install, then the composer commands the caller lists, in order (audit,
# style, Rector, PHPStan, tests).
#
#   php:
#     uses: jwill89/shared-tooling/.github/workflows/php.yml@v1.0.0
#     with:
#       dir: backend
#       extensions: pdo, pdo_sqlite, curl, fileinfo, gd, mbstring
#       before: cp .env.example .env && php artisan key:generate
#       commands: audit lint rector:check analyse test

on:
  workflow_call:
    inputs:
      dir:
        description: The folder holding composer.json.
        type: string
        default: .
      php-version:
        description: The PHP version, as the server runs it.
        type: string
        default: '8.5'
      extensions:
        description: The ext-* composer.json requires.
        type: string
        default: ''
      coverage:
        description: The coverage driver (none, or pcov for a floor check).
        type: string
        default: none
      before:
        description: Shell to run after the install and before the commands (an .env for Laravel, say).
        type: string
        default: ''
      commands:
        description: composer commands to run, in order, separated by spaces or newlines.
        type: string
        default: audit validate lint rector:check stan test

permissions:
  contents: read

jobs:
  php:
    # A pull request from a fork runs on GitHub's runners, never on a self-hosted one.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || vars.CI_RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: ${{ inputs.dir }}
    env:
      # Each check runs through ci/Invoke-CiCheck.ps1, which records it for the run's report.
      CI_TOOLS: ${{ github.workspace }}/shared/ci
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.extensions }}
          coverage: ${{ inputs.coverage }}
          tools: composer

      # A self-hosted runner keeps Composer's download cache itself (runner/README.md), so
      # vendor/ doesn't travel to GitHub's.
      - name: Restore Composer packages
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: ${{ inputs.dir }}/vendor
          key: composer-${{ runner.os }}-${{ inputs.php-version }}-${{ hashFiles(format('{0}/composer.lock', inputs.dir)) }}
          restore-keys: composer-${{ runner.os }}-${{ inputs.php-version }}-

      - name: Install
        shell: pwsh
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'composer install' -Command 'composer install --prefer-dist --no-interaction --no-progress'

      - name: Prepare
        if: inputs.before != ''
        shell: pwsh
        env:
          BEFORE: ${{ inputs.before }}
        run: |
          & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name 'Prepare' -Command 'bash -c "$BEFORE"'

      # Dev packages included in the audit: they run here and on developer machines too.
      - name: Commands
        shell: pwsh
        env:
          COMMANDS: ${{ inputs.commands }}
        run: |
          foreach ($command in -split $env:COMMANDS) {
            & "$env:CI_TOOLS/Invoke-CiCheck.ps1" -Name "composer $command" -Command "composer $command" -Group
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      # On a failure, the job's checks go up for report.yml to merge into the run's report.
      - name: CI report
        id: ci-report
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: '& "$env:CI_TOOLS/Complete-CiReport.ps1"'

      - name: Upload the CI report
        if: failure() && steps.ci-report.outputs.name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ci-report.outputs.name }}
          path: ${{ runner.temp }}/ci-report
          retention-days: 7
          if-no-files-found: ignore
